name: CI Enterprise Pipeline Optimization

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # Step 2: Set up Python environment matching production Lambda
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.11'

    # Step 3: Install development and testing dependencies
    - name: Install Enterprise Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Step 4: Run a lint check to make sure your code looks flawless
    - name: Execute Code Linting Validation (Flake8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Step 5: Run a mock logic sanity test
    - name: Run Core Logic Verification
      run: |
        python local_build/src/core/data_manager.py
        python local_build/src/core/template_manager.py
